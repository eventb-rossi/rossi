id = "eventb"
name = "Event-B (Rossi)"
version = "0.1.0"
schema_version = 1
authors = ["Rossi Contributors"]
description = "Event-B language support (Rossi): eventb-language-server over LSP plus tree-sitter syntax highlighting."
repository = "https://github.com/eventb-rossi/rossi"

# The tree-sitter grammar. Zed fetches grammars from a git repository at a
# pinned revision (there is no local-path option). The grammar is the standalone
# `eventb-rossi/tree-sitter-eventb` repository, developed in this monorepo as
# the `editors/tree-sitter-eventb/` submodule. `rev` must match the submodule's
# commit: `languages/eventb/highlights.scm` is a byte-for-byte copy of that
# revision's `queries/highlights.scm`, so a stale `rev` means the bundled query
# references nodes the fetched grammar does not have. Until the repository is
# published, see editors/zed/INSTALL.md for the local-development `file://`
# workflow.
[grammars.eventb]
repository = "https://github.com/eventb-rossi/tree-sitter-eventb"
rev = "b6d0f629d2c90908fde93e88e2a626965e65f48b"

[language_servers.eventb-language-server]
name = "Rossi Event-B Language Server"
languages = ["Event-B"]
