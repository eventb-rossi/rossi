version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # zip 9.4.2 made zeroize and constant_time_eq required dependencies;
      # Cargo.lock stays on 9.4.1, the last release without them. Delete this
      # rule to take newer zip releases again.
      - dependency-name: "zip"
        versions: [">=9.4.2"]

  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    schedule:
      interval: "weekly"
    ignore:
      # @types/vscode must match engines.vscode (the minimum supported VS Code
      # version), not track latest, or `vsce package` fails. Bump it manually
      # alongside engines.vscode when raising the minimum.
      - dependency-name: "@types/vscode"
