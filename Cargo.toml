[workspace]
resolver = "3"
members = [
    "crates/rossi",
    "crates/rossi-build",
    "crates/rossi-cli",
    "crates/rossi-prove",
    "crates/eventb-lsp",
    "crates/eventb-fuzz",
    "crates/xtask",
]
# The Zed extension is a standalone `cdylib` built to wasm by Zed (against
# `zed_extension_api`), not part of this workspace's native build/test. The
# tree-sitter grammar is its own repository (a submodule) with its own Rust
# binding crate; without the exclude, cargo refuses to run inside it.
# `crates/tree-sitter-parity` dev-depends on that submodule crate: as a member it
# would make every `cargo build` — including a clone without
# `--recurse-submodules` — fail at manifest resolution.
exclude = ["editors/zed", "editors/tree-sitter-eventb", "crates/tree-sitter-parity"]

[workspace.package]
version = "0.2.2"
edition = "2024"
# Minimum supported Rust version: the edition-2024 floor. Verified by building
# the whole workspace with `--all-features` on 1.85.0.
rust-version = "1.85"
authors = ["Rossi Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eventb-rossi/rossi"

[workspace.dependencies]
# Parser dependencies
pest = "2.7"
pest_derive = "2.7"
num-bigint = "0.5"
stacker = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
rayon = "1"
mimalloc = "0.1"
quick-xml = "0.41"
# Rossi only reads and writes Stored/Deflated Rodin archives; the default
# feature set would link every other decompressor (zstd, bzip2, lzma, ppmd,
# deflate64, AES) into the shipped binaries because the reader dispatches on
# compression method at runtime, so LTO cannot dead-strip them.
zip = { version = "8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# LSP dependencies
# Protocol types are re-exported from eventb-lsp as `crate::lsp_types` so they
# always match the version tower-lsp uses internally.
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync", "time", "process"] }
serde_json = "1.0"
ropey = "1.6"
dashmap = "6"
parking_lot = "0.12"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
# Filesystem watcher for the Rodin workspace sync (eventb-lsp).
notify = "8"
# 3-way merge (git-style conflict markers) for syncing Rodin model edits
# back into the Event-B text sources (eventb-lsp).
diffy = "0.5"
# RAII temp directories for the eventb-animate lens flow (eventb-lsp):
# each run builds the model into a throwaway Rodin project directory.
tempfile = "3"

# Dev dependencies
indoc = "2.0"
test-case = "3.3"
proptest = "1.6"

# Workspace crates
rossi = { version = "0.2.2", path = "crates/rossi" }
rossi-build = { version = "0.2.2", path = "crates/rossi-build" }
rossi-prove = { version = "0.2.2", path = "crates/rossi-prove" }
eventb-lsp = { version = "0.2.2", path = "crates/eventb-lsp" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Fuzzing needs the speed of a release build with none of its diagnostics
# stripped away: `panic = "abort"` would turn every caught panic into a dead
# process with no finding attached, and a stripped binary reports a crash
# without the location that makes it actionable. Overflow checks and debug
# assertions stay on because a fuzzer's job is to find exactly what they catch.
# Full LTO and one codegen unit are dropped so an edit-and-rerun cycle takes
# seconds rather than minutes.
[profile.fuzz]
inherits = "release"
panic = "unwind"
strip = false
debug = 1
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
