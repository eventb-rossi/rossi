[package]
name = "rossi-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Static checker / builder for Event-B models in Rossi. Reads .buc/.bum and emits Rodin-compatible .bcc/.bcm."
keywords = ["event-b", "rodin", "static-checker", "formal-methods"]
categories = ["development-tools", "parser-implementations"]

[dependencies]
rossi.workspace = true
rossi-prove.workspace = true
thiserror.workspace = true
quick-xml.workspace = true
rayon.workspace = true
serde = { workspace = true, optional = true }
walkdir.workspace = true
zip.workspace = true

[dev-dependencies]
# Only to build an integer wider than the surface parser accepts, so the
# dump's string encoding of a literal is exercised against a real one.
num-bigint.workspace = true
proptest.workspace = true
serde_json.workspace = true

[features]
default = []
# Serialization of the dump document. The DTOs in `dump` derive
# `Serialize` only under this feature, so a consumer that just builds a
# project never pulls serde in.
serde = ["dep:serde", "rossi/serde"]

[package.metadata.docs.rs]
# Document the `serde`-gated APIs on docs.rs.
all-features = true
