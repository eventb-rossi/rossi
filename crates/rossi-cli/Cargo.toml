[package]
name = "rossi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Command-line interface for the Rossi Event-B toolchain"
license.workspace = true
repository.workspace = true
keywords = ["cli", "event-b", "formal-methods", "verification"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rossi"
path = "src/main.rs"
doc = false

[features]
default = ["mimalloc", "mcp"]
# Allocate through mimalloc instead of the system allocator; see
# the `#[global_allocator]` in src/main.rs.
mimalloc = ["dep:mimalloc"]
# The `rossi mcp` subcommand: the Model Context Protocol server for LLM
# hosts. Brings an async runtime into the binary; a packager who does not
# want it builds without the feature.
mcp = ["dep:eventb-mcp", "dep:eventb-animate-driver", "dep:tokio", "dep:tracing-subscriber"]

[dependencies]
rossi.workspace = true
rossi-build = { workspace = true, features = ["serde"] }
rossi-prove.workspace = true
clap.workspace = true
clap_complete.workspace = true
rayon.workspace = true
serde = { workspace = true }
serde_json.workspace = true
zip.workspace = true
mimalloc = { workspace = true, optional = true }
eventb-mcp = { workspace = true, optional = true }
eventb-animate-driver = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
